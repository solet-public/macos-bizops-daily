name: marketo_plugin
description: >
  Marketo Engage marketing-automation connector — lead query (get_leads),
  lead field/filter metadata (describe_lead_fields), current-day API usage
  (get_api_usage), activity type discovery and history
  (list_activity_types, get_activities), lead CRUD
  (create_or_update_leads, delete_leads), campaign trigger
  (list_campaigns, trigger_campaign), and static list membership
  (list_static_lists, add_leads_to_list, remove_leads_from_list). REST API
  (no official Marketo SDK) via a plain
  synchronous httpx client. Auth: OAuth 2.0 client-credentials against a
  LaunchPoint custom service, resolved from the address book entry
  "marketo_instance" via chain-consumed vault:: references — the same
  auth-simplicity class as zuora_plugin: no browser, no callback server, and
  the short-lived bearer token is re-minted in process memory and never
  vaulted (only the durable client_secret is a vault secret).

  Foreign-target invariant (SQL-lockdown honesty condition): this plugin
  reaches ONLY the Marketo instance resolved from the operator-registered
  "marketo_instance" address-book entry — no base_url parameter on any verb.
  It never imports or touches the platform state DB, and (being a pure REST
  connector with no SQL-shaped strings) trips no SQL-lockdown gate class at
  all.

  Read/write posture — full CRUD INCLUDING delete and merge: unlike
  zuora_plugin (no delete verb — billing records are voided through Zuora's
  own workflow), Marketo's REST API natively supports lead deletion
  (delete_leads) and lead merging (merge_leads, up to 25 losing leads per
  call, capped at 1 when merge_in_crm is set). This makes marketo_plugin the
  first marketing-data connector in the suite with destructive verbs —
  flagged explicitly here and in the knowledge-base overview rather than
  folded in silently.
optional: true

implements:
  - interface: EdgeProcessProvider

config:
  request_timeout_seconds:
    type: number
    required: false
    default: 30
    description: >
      Per-request HTTP timeout for the Marketo REST client, bounding hung calls.

# Credentials live in the address book entry "marketo_instance": literals
# (base_url — the operator's Marketo REST endpoint, e.g.
# https://123-ABC-456.mktorest.com — and client_id) plus a client_secret
# field that stores a
# "vault::<solet>.default_address_book_plugin.marketo_client_secret"
# reference (chain-consumed). The secret lives in the RESOLVER's namespace so
# the address book reads it under its own identity (resolve_with_secrets).
# It is chain-consumed — this plugin neither declares nor reads that vault
# key directly, and it holds no plugin-owned runtime vault keys of its own
# (the re-minted bearer token is in-memory only, never persisted), so both
# VaultKeysProvider hooks return [].
