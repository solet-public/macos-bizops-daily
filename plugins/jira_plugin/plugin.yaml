name: jira_plugin
description: >
  Jira Cloud connector — issues, JQL search, comments, transitions, and
  attachments (blob-bridged) for the solet, peers, and plans. Full
  read/write including delete_issue (ticket deletion is an acceptable-loss
  class). Headless HTTP basic-auth against a dedicated scoped Atlassian
  service account (account email + API token); the token is chain-consumed
  from the address book entry "jira_site" via a vault:: reference — no OAuth,
  no browser flow, no callback server. The API token EXPIRES (Atlassian
  default 1yr, 1-365d configurable); the entry records expires_at and the
  plugin warns loudly (jira.token_expiring) as expiry approaches rather than
  surfacing a mystery 401.

  Foreign-target invariant (SQL-lockdown honesty condition, umbrella design
  §3): this plugin reaches ONLY the Atlassian site resolved from the
  operator-registered "jira_site" address-book entry — no base_url/site
  parameter on any verb. It never imports or touches the platform state DB.
optional: true

implements:
  - interface: EdgeProcessProvider

config:
  token_expiry_warn_days:
    type: integer
    required: false
    default: 14
    description: >
      Emit a loud jira.token_expiring warning when the API token's recorded
      expires_at is within this many days. Never mints or rotates the token
      (the plugin cannot); rotation is an operator runbook.
  request_timeout_seconds:
    type: number
    required: false
    default: 30
    description: >
      Per-request HTTP timeout for the Jira client, bounding hung calls.

# Credentials live in the address book entry "jira_site": literals (base_url,
# email, expires_at, scope_note) plus an api_token field that stores a
# "vault::<solet>.default_address_book_plugin.jira_api_token" reference.
# The secret lives in the RESOLVER's namespace so the address book reads it
# under its own identity (resolve_with_secrets). It is chain-consumed — this
# plugin neither declares nor reads that vault key directly (see
# constants.VAULT_KEY_API_TOKEN), and it holds no plugin-owned runtime vault
# keys of its own, so both VaultKeysProvider hooks return [].
