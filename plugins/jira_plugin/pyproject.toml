[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira_plugin"
version = "1.0.0"
description = "Jira Cloud (issues, JQL, comments, transitions, attachments) connector plugin for Ananta"
authors = [
    {name = "Ananta Development Team", email = "dev@ananta.ai"},
]
license = "Apache-2.0"
requires-python = "==3.13.*"
dependencies = [
    "ananta",
    # pycontribs `jira` client — mature Jira-focused library with typed
    # Issue/Comment/Attachment resources, first-class HTTP basic-auth
    # (email + API token), transitions, and attachment APIs. Library-first,
    # no CLI wrapping. `requests` arrives transitively — do not add it here.
    "jira>=3.8",
]

[project.entry-points."ananta.plugins"]
jira_plugin = "jira_plugin.plugin:JiraPlugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jira_plugin*"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
