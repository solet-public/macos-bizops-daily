name: github_midwife_plugin
description: |
  Knowledge base for the GitHub-genesis midwife plugin (the BIRTH SPINE).
  Holds the process JSON for the dual-use birth_solet verb, the
  macos-free-solet profile template (per-plugin template ownership
  convention), its checked-in profile_baseline/ per-plugin config
  templates (genesis has no parent solet to read a baseline from —
  and the seed factory reads these at assemble time, cross-plugin), the
  hydration_templates/ operator-env bundle (agent-rendered at genesis
  time — NOT KB articles), and the prose articles: the hydration runbook,
  the first-days owner-onboarding runbook (promoted into the birth-spine
  KB 2026-07-20), the seed-update runbook (pull-based update of a
  live solet from a re-mint, added 2026-07-22), the upstream
  feedback runbook (how a deployment reports defects and requests
  features from the seed's maintainers, added 2026-08-11), the
  deployment report card article (the fully-deployed-state roster and
  operator-facing card, added 2026-08-11), and the Homebrew install
  troubleshooting runbook (driving `solet create` past its stops on the
  brew-install path, added 2026-09-08). The seed factory data files (seed_manifest.yaml,
  capability_bundles.yaml), the seed-README render-source, and the seed
  publish/licensing articles moved to seed_factory_plugin in the 2026-07-20
  split.
content:
  patterns:
    # hydration_templates/ holds render-source template files (shell,
    # JSON, markdown), not articles — ingesting them would pollute
    # retrieval for every newborn.
    # The dir is kept FLAT because Path.match has no recursive `**`;
    # one pattern covers it. Include patterns stay at the platform
    # default (*.md, *.txt, *.rst).
    #
    # parse_manifest REPLACES exclude_patterns rather than merging
    # (default_knowledge_plugin/kb_indexing.py), so the platform-default
    # excludes are re-stated here — dropping them would re-admit .git/
    # .archive/scripts content.
    exclude:
      - "**/.git/**"
      - "**/.archive/**"
      - "**/scripts/**"
      - "hydration_templates/*"
