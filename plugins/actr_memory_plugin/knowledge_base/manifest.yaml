name: actr_memory_plugin
description: >
  Actr Memory plugin process definitions and reference documentation.

category: plugin-internal
tags:
  - plugin_reference
  - actr_memory

content:
  patterns:
    include:
      - "**/*.md"
      - "**/*.txt"
    exclude:
      - "**/.git/**"
      - "**/.archive/**"
      - "processes/**"
  chunking:
    strategy: headers
    max_chars: 3000
    overlap_chars: 200
