name: platform_health_plugin
description: |
  WARNING: a diagnostic name does not make this process diagnose-safe: live
  read-shape calls can reach external systems. `dry_run` defaults to true and
  returns the complete classification table without dispatching anything.
  Live dispatch requires `dry_run=false`; its default scope is read-shape
  `service_interface` providers only. An outward-facing plugin provider must
  be explicitly enumerated in `external_namespaces` and accompanied by an
  `operator_confirmation` turn/message id. `write_enabled` still gates only
  write-shape verbs. NOT a startup-blocking gate — manual operator/CI use via
  `plugin::platform_health_plugin::execute_registry_sweep`.

  Catches the failure modes that bit the platform 2026-05-28..30:
  D5 EDGE-wake schema mismatch; scheduling_service::execute_in_seconds
  "Process not found or malformed in registry"; session_ledger SQL
  "operator does not exist: integer = boolean".

optional: true

config:
  alert_role:
    type: string
    required: false
    description: >
      Durable peer-messaging role name that check_host_disk_headroom alerts
      on a host free-space severity transition (ok/warning/critical). No
      shipped default -- a role name that exists in one solet's
      role-binding table is a guess in another's, so this is a
      deployment-local setting, not a constant in source. When unset, the
      check still measures and classifies correctly but cannot alert
      anyone (alert_reason='alert_target_unconfigured', logged at ERROR),
      and ensure_host_disk_guard_schedule refuses to install the cron
      (logged at ERROR). Nothing installs the cron at plugin startup:
      scheduling_service does not exist yet then. A deployment installs it
      by adding ensure_host_disk_guard_schedule to its own runtime
      config/starting_action_definitions.json (run after startup
      completes), or by calling that verb; no shipped profile template
      carries it. The installed cron always reads this key; it takes no
      per-install override.
      Set per-deployment under profile/config/plugins/platform_health_plugin.json
      (an operator config override, never shipped seed content).

implements:
  - interface: EdgeProcessProvider
