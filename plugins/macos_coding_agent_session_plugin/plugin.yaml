name: macos_coding_agent_session_plugin
description: >
  macOS-scope plugin owning MCP bridge subprocess lifecycle for every
  coding-agent tab. Implements CodingAgentSessionServiceInterface (four
  verbs — spawn_bridge / terminate_bridge / restart_bridge /
  list_bridges) plus a thread-backed FSEvents watcher on
  ~/.ananta/runtime/<solet>.bridge.port that auto-restarts every
  tracked bridge whenever router blue-green swap rewrites the port
  file. Eliminates the operator's `/mcp reconnect` ceremony. The
  iTerm2 plugin (and any future terminal-emulator-control plugin)
  calls into this service via service_interface::coding_agent_session_service::*
  keys. Local-profile only; macOS-scope (uses pyobjc FSEvents and BSD
  signals). See workbench/2026-06-05_bridge_port_routing_and_session_lifecycle_design.md
  §3.6 + §4.4 + §6 Slice 5 for the canonical design.
optional: true

implements:
  - interface: EdgeProcessProvider
  - interface: CodingAgentSessionServiceInterface
