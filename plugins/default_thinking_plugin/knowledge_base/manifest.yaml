name: thinking_plans
description: >
  Execution plans generated by the thinking model.
  Each step is chunked individually for retrieval during plan execution.

category: plugin-internal
tags:
  - plan
  - execution_plan

content:
  patterns:
    include:
      - "plans/**/*.md"
      - "manifests/**/*.md"
      - "wbs/**/*.md"
    exclude:
      - "**/.git/**"
      - "**/.archive/**"
      - "processes/**"
  chunking:
    strategy: headers
    max_chars: 3000
    overlap_chars: 0
