name: thinking_playbooks
description: >
  Project playbooks generated by the planning inference loop.
  Each section is chunked individually for retrieval during plan execution.

category: plugin-internal
tags:
  - playbook
  - project_plan

content:
  patterns:
    include:
      - "playbooks/**/*.md"
    exclude:
      - "**/.git/**"
      - "**/.archive/**"
  chunking:
    strategy: headers
    max_chars: 3000
    overlap_chars: 0
