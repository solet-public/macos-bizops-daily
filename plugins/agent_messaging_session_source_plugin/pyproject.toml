[project]
name = "agent_messaging_session_source_plugin"
version = "1.0.0"
description = "LLM session ledger source for the agent_messaging thread/message tables."
license = "Apache-2.0"
requires-python = "==3.13.*"
dependencies = []

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[project.entry-points."ananta.plugins"]
agent_messaging_session_source_plugin = "agent_messaging_session_source_plugin.plugin:AgentMessagingSessionSourcePlugin"
