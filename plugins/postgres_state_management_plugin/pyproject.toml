[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postgres-state-management-plugin"
version = "0.1.0"
description = "PostgreSQL state management plugin for Ananta framework"
authors = [{name = "Ananta Development Team"}]
license = "Apache-2.0"
requires-python = "==3.13.*"
dependencies = [
    "ananta",
    "psycopg[pool]>=3.1.0",
    "pydantic>=2.0.0",
    "keyring>=24.0.0",
]

[project.entry-points."ananta.plugins"]
postgres_state_management_plugin = "postgres_state_management_plugin.plugin:PostgresStatePlugin"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["postgres_state_management_plugin"]
