[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "default_knowledge_plugin"
version = "0.1.0"
description = "Directory-backed knowledge base lifecycle and semantic search"
license = "Apache-2.0"
requires-python = "==3.13.*"
dependencies = [
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."ananta.plugins"]
default_knowledge_plugin = "default_knowledge_plugin.plugin:DefaultKnowledgePlugin"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[tool.black]
line-length = 100
target-version = ['py313']
