[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zuora_plugin"
version = "1.0.0"
description = "Zuora subscription-billing connector (Data Query, object CRUD, bulk export) for Ananta"
authors = [
    {name = "Ananta Development Team", email = "dev@ananta.ai"},
]
license = "Apache-2.0"
requires-python = "==3.13.*"
dependencies = [
    "ananta",
    # No official Zuora SDK — a plain synchronous REST client is the executor.
    "httpx>=0.27",
]

[project.entry-points."ananta.plugins"]
zuora_plugin = "zuora_plugin.plugin:ZuoraPlugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["zuora_plugin*"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
