[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "external_postgres_plugin"
version = "1.0.0"
description = "Read-only foreign-Postgres query plugin (a super Datagrip) for Ananta"
authors = [
    {name = "Ananta Development Team", email = "dev@ananta.ai"},
]
license = "Apache-2.0"
requires-python = "==3.13.*"
dependencies = [
    "ananta",
    # Official psycopg v3 (binary wheel avoids a libpq build dep) — the executor.
    "psycopg[binary]>=3.2",
    # sqlparse (BSD) — the single-statement parser (result-shape hygiene, NOT the
    # write boundary; the read-only connection is the boundary). Operator-ratified
    # rev-F-final over pglast (GPL-3.0).
    "sqlparse>=0.5",
]

[project.entry-points."ananta.plugins"]
external_postgres_plugin = "external_postgres_plugin.plugin:ExternalPostgresPlugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["external_postgres_plugin*"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
