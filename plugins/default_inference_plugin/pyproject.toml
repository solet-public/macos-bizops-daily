[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "default_inference_plugin"
version = "0.1.0"
description = "Default inference plugin for Ananta (LM Studio provider)"
license = "Apache-2.0"
requires-python = "==3.13.*"
dependencies = [
    "ananta",
    "httpx>=0.24",
]

[project.entry-points."ananta.plugins"]
default_inference_plugin = "default_inference_plugin.plugin:Plugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["default_inference_plugin*"]

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict = true

[tool.isort]
profile = "black"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TCH"]