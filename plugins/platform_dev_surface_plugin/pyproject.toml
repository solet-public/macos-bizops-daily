[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platform_dev_surface_plugin"
version = "1.0.0"
description = "Platform dev-surface plugin — read-only repo primitives (repo_service) and quality-gate/smoke execution (quality_service) for external MCP clients and the run_joseki driver."
authors = [
    {name = "Ananta Development Team", email = "dev@ananta.ai"},
]
license = "Apache-2.0"
requires-python = "==3.13.*"
dependencies = [
    "ananta",
]

[project.entry-points."ananta.plugins"]
platform_dev_surface_plugin = "platform_dev_surface_plugin.plugin:PlatformDevSurfacePlugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["platform_dev_surface_plugin*"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
