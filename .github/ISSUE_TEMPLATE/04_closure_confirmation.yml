name: Closure confirmation
description: You verified that a previously reported item is actually fixed.
title: "§N.M — "
labels: ["closure-confirmation"]
body:
  - type: markdown
    attributes:
      value: >-
        These are genuinely valuable — send them. A fix that shipped and a fix
        that shipped and *works on a born clone* are different facts, and only a
        deployment can establish the second one. This is also the place to say a
        fix did **not** work; a reopened item is more useful than a silent one.

  - type: input
    id: item_number
    attributes:
      label: Item number
      description: The new item number for this confirmation, as `§N.M`. Repeat it at the front of the issue title.
      placeholder: "§43.1"
    validations:
      required: true

  - type: input
    id: confirming
    attributes:
      label: The item being confirmed
      description: >-
        The original item's `§N.M`, and its issue number if you have it. Both are
        useful and they are not interchangeable.
      placeholder: "§41.2 (#87)"
    validations:
      required: true

  - type: dropdown
    id: outcome
    attributes:
      label: Verified outcome
      options:
        - Fixed — verified working on this deployment
        - Partially fixed — the reported case works, a related case does not
        - Not fixed — the original symptom still reproduces
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: How you verified it
      description: >-
        The command you ran and its output. The same evidence discipline as a
        defect report applies to a confirmation — "seems fine now" is not a
        verification, and a confirmation that turns out to be wrong is expensive
        precisely because it closes an item.
      render: shell
    validations:
      required: true

  - type: input
    id: release
    attributes:
      label: Release you verified on
      description: The seed HEAD commit and RELEASE_NOTES.md version you adopted before testing.
    validations:
      required: true

  - type: checkboxes
    id: content_gate
    attributes:
      label: Content gate
      description: >-
        This issue is published the moment you submit it, and editing it
        afterwards does not unpublish what was there.
      options:
        - label: >-
            I re-read this issue and it contains no personal identifiers, no
            employer or business specifics, and no credentials or secret-looking
            values — including inside the pasted verification output.
          required: true
