[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fresh_install_with_pip_dep_smoke_plugin"
version = "1.0.0"
description = "Test fixture for C4 new-pip-deps smoke. Mirrors fresh_install_smoke_plugin's shape but declares a real pip dependency (tabulate) so the smoke exercises the install-with-new-pip-dep code path (apply_manifest + restart_with_manifest pickup) the operator cited as failing on 2026-06-15. tabulate is pure-Python, MIT-licensed, zero transitive deps, and well-known."
requires-python = "==3.13.*"
dependencies = ["tabulate>=0.9.0"]

[project.entry-points."ananta.plugins"]
fresh_install_with_pip_dep_smoke_plugin = "fresh_install_with_pip_dep_smoke_plugin.plugin:FreshInstallWithPipDepSmokePlugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fresh_install_with_pip_dep_smoke_plugin*"]
