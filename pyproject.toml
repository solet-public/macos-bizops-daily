include = ["ananta/src", "plugins", "initialization/src", "quality_gates", "bootstrap_adapter"]
exclude = [
    "**/tests",
    # RULING (reviewing seat, 2026-08-08):
    # stays OUT — gates protect code that runs or ships, and disabled code
    # does neither. CONDITION, the exemption's only exit: re-enabling ANY
    # disabled plugin requires bringing it into scope and landing it CLEAN
    # as part of the re-enable, not as a follow-up. Stands on category, not
    # on being clean — measured 2026-08-08: 76 files, 2 ruff / 195 pyright
    # errors (workbench/2026-08-08_gate_scope_widening_measurement_d3-impl.md).
    "disabled_plugins",
    "dev_tools",
    "**/.venv",
    "**/.venv_*",
    "**/venv",
    "**/venv_*",
    "**/node_modules",
    # Vendored third-party instrument library scripts — not our code
    "**/instruments/**",
    "plugins/musical_synthesis_plugin/instruments",
    # Operator-tooling at plugin scope — the blanket 2026-05-26 exemption
    # below is NARROWED by the operator ruling of 2026-08-08 ("quality
    # gates apply to everything, boy scout rules"). See pyproject.toml
    # [tool.ruff] extend-exclude for the full note (tools/ and
    # parity_tests/ both landed CC-clean 2026-08-09 and are off this list
    # entirely; migrations/ is unaddressed and OPEN; research/ stays OUT
    # with a promotion-clean condition, mirrored below).
    #
    # RULING (reviewing seat, 2026-08-08):
    # `research/` stays OUT — scratch is not shipped code, and 1,071
    # pyright errors would block every writer for weeks to protect code
    # that never runs. CONDITION, the exemption's only exit: anything
    # PROMOTED from research/ into src/ comes in clean AT PROMOTION TIME —
    # cleanup is not deferred as a sidecar to the structural move.
    "plugins/*/research/**",
    "plugins/*/migrations/**",
]
# Relaxed only for third-party library type inference (not defensive programming):
reportUnknownVariableType = "none"      # third-party libs without stubs
reportUnknownMemberType = "none"        # third-party libs without stubs
reportUnknownArgumentType = "none"      # third-party libs without stubs
reportUnknownLambdaType = "none"        # third-party libs without stubs
reportUnknownParameterType = "none"     # third-party libs without stubs
reportMissingParameterType = "none"     # third-party libs without stubs
reportMissingTypeStubs = "none"         # third-party libs without stubs (mido, soundfile, etc.)
reportAttributeAccessIssue = "none"     # third-party libs without stubs (mido, tinysoundfont, pedalboard)
reportPrivateUsage = "none"             # internal access across modules is ok
reportUnsupportedDunderAll = "none"     # __all__ exports pattern

[tool.vulture]
min_confidence = 80
paths = ["ananta/src", "plugins"]
# Without this exclude, bare `vulture` crashes trying to parse the bundled
# py3.10 third-party venv under cosyvoice2_tts_plugin (+ any stray site-packages
# / node_modules). Mirrors the invocation used in the 2026-06-20 dead-code sweep.
exclude = ["*/.venv_cosyvoice/*", "*/site-packages/*", "*/.venv/*", "*/node_modules/*"]
# `state` is part of the @platform_process action contract (params, state); the
# framework hands the second positional argument in even when individual actions
# don't read it. Excluding it stops vulture from flagging every action handler.
ignore_names = ["state"]
